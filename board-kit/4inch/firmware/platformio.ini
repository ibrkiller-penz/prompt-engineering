; Waveshare ESP32-S3-Touch-LCD-4 V4.0 (4인치 480x480, ST7701 RGB + GT911 터치, 도우미 칩 CH32V003)
; 모듈 ESP32-S3-WROOM-1-N16R8: 플래시 16MB(QIO) + PSRAM 8MB(OPI)
; 연결: 칩 내장 USB(USB-Serial/JTAG, VID:PID 303A:1001). 굽기와 기록(시리얼 로그)이 같은 USB 로 나온다(ARDUINO_USB_MODE=1, CDC_ON_BOOT=1).
; 플랫폼: pioarduino(Arduino-ESP32 3.x). 이 키트는 Arduino-ESP32 3.3.12 / ESP-IDF 5.5.5 로 빌드해 확인했다.
;
; ★ 빌드는 tools/build_board.ps1 로 한다. 프로젝트 경로에 한글이 있으면 CMake 가 실패하므로(아래 custom_sdkconfig 때문),
;   스크립트가 firmware 폴더를 영문 경로로 복사해 거기서 빌드한다. 그래서 여기에는 build_dir 을 적지 않았다.
; ★ COM 포트도 여기에 적지 않았다(PC 마다 다르다). 스크립트가 자동으로 찾거나 -Port COMx 로 받는다.

[env:board4inch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I include

; RGB 화면 밀림·떨림 대책 — Espressif ESP-FAQ(LCD) 권장 + Waveshare 공장 예제와 같게.
;  - ISR_IRAM_SAFE          : 플래시에 쓰는 동안에도 화면 인터럽트가 돈다
;  - XIP_FROM_PSRAM         : 코드·상수를 PSRAM 에서 실행 → 와이파이·플래시 쓰기 중에도 PSRAM 이 안 멈춘다
;  - DATA_CACHE_LINE_64B    : 완충 버퍼(bounce buffer)를 쓸 때 권장값, 공장 예제도 같다
;  - COMPILER_OPTIMIZATION_PERF : 권장, 공장 예제도 같다
;  - SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n : 와이파이 버퍼를 PSRAM 에 두지 않는다(ESP-FAQ: 와이파이 중 밀림이 남으면 끄라고 함)
; ※ CONFIG_LCD_RGB_RESTART_IN_VSYNC 는 절대 켜지 않는다. ESP-IDF 5.5.x 버그(espressif/esp-idf#19070):
;   완충 버퍼 모드에서 켜면 박자가 한 번만 어긋나도 화면이 영구히 밀린다. 끄면 드라이버가 저절로 다시 맞춘다.
; 이 설정을 바꾸면 ESP-IDF 를 다시 컴파일하므로 첫 빌드가 35~45분 걸린다(그 뒤에는 약 9분).
custom_sdkconfig =
  CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_COMPILER_OPTIMIZATION_PERF=y
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=n

; 라이브러리: 버전을 고정해 PlatformIO 레지스트리에서 받는다(첫 빌드 때 자동 다운로드).
; 로컬 사본(lib/)을 둔 것 두 가지:
;  - WS_CH32_IO : Waveshare 도우미 칩 라이브러리. 레지스트리에 없다(Apache-2.0).
;  - GFX_Library_for_Arduino : 레지스트리의 moononournation/GFX Library for Arduino@1.5.3 은 Arduino-ESP32 3.3 에서 빌드가 실패한다
;    (spiFrequencyToClockDiv 인자 변경). Waveshare 가 고친 사본을 쓴다 — lib/GFX_Library_for_Arduino/PATCH_NOTE.txt 참고.
; ※ lib_ldf_mode = deep+ 는 넣지 않는다(Arduino 3.3 의 Network.h 를 못 찾는다).
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  lvgl/lvgl@8.4.0
  lewisxhe/SensorLib@0.2.6
