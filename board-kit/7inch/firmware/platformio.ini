; Waveshare ESP32-S3-Touch-LCD-7 (7인치, 800x480). RGB 화면 ST7262, 터치 GT911, IO 확장 칩 CH422G
; 모듈 ESP32-S3-WROOM-1-N16R8: 플래시 16MB(QIO) + PSRAM 8MB(OPI)
; 화면 드라이버 ESP32_Display_Panel 1.0.0 은 Arduino-ESP32 3.x 가 필요하다 → pioarduino 플랫폼을 쓴다.
; LVGL 은 Waveshare 데모와 같은 8.3.x 로 고정.
;
; 이 폴더에서 바로 'pio run' 하지 말고 tools/build_board.ps1 로 빌드한다.
;   프로젝트 경로에 한글이 있으면 CMake·링커가 실패한다(custom_sdkconfig 로 ESP-IDF 를 다시 컴파일할 때).
;   build_board.ps1 이 firmware 폴더를 영문 경로로 복사해 거기서 빌드한다.
;
; COM 포트는 여기에 적지 않는다. build_board.ps1 -Port COM5 처럼 넘기거나(또는 환경변수 PIO_PORT),
; 아무것도 안 주면 PlatformIO 가 보드를 자동으로 찾는다.

; 빌드 환경 두 개(공통 설정은 [env]):
;   [env:board]   800x480 Waveshare ESP32-S3-Touch-LCD-7 (기존 보드)
;   [env:board7b] 1024x600 Waveshare ESP32-S3-Touch-LCD-7B (확장 칩 0x24, src/ioexp.cpp)
;   build_board.ps1 -Env board7b -Port COM9 처럼 고른다(기본은 board).
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; upload_port / monitor_port 는 일부러 비워 둔다(위 설명). 직접 쓰려면 아래 줄의 ; 를 지우고 번호를 바꾼다.
;upload_port = COM5   ; ← 내 보드의 COM 번호
;monitor_port = COM5
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -O2

; 크기(-Os)보다 속도(-O2) 우선으로 컴파일한다 → 화면 다시 그리기가 빨라진다
build_unflags = -Os

; ──────────────── 화면 흔들림(밀림) 대책 — 힘들게 찾은 값이다. 함부로 바꾸지 말 것 ────────────────
; RGB 화면 설정은 Waveshare 공장 ESP-IDF 예제(08_lvgl_v8_demo 의 sdkconfig.defaults) 그대로다.
; pioarduino 가 ESP-IDF 라이브러리를 이 설정으로 다시 컴파일한다(처음 한 번 25~45분).
;  - XIP_FROM_PSRAM·RODATA : 코드·상수를 PSRAM 에서 실행 → 플래시 쓰기 중에도 캐시가 안 멈춘다
;  - 캐시 데이터 64KB·줄 64B·명령 32KB : 완충(bounce) 버퍼 방식에 맞는 값(Waveshare ESP-FAQ LCD)
; CONFIG_LCD_RGB_RESTART_IN_VSYNC 는 '=n' 으로 명시해 끈다 — pioarduino 기본값이 y 라서 안 적으면 켜진 채 남는다(2026-10-16 확인).
;   켜 두면 완충 버퍼와 함께 EOF 하나만 놓쳐도 화면이 영구히 어긋나고, 1분마다 하는 다시 맞추기도 효과가 없다.
;   (espressif/esp-idf#19070. '가끔 밀린 채로 남고 리셋해야 돌아오던' 원인).
; 그 밖의 대책(코드에 있다): 픽셀 클록 16MHz 유지(14MHz 로 낮추면 더 나빠졌다) · 프레임 버퍼 1장(PSRAM) +
;   LVGL 은 내부 RAM 10줄 버퍼 · 분이 바뀔 때만 다시 그림 · 와이파이는 1시간마다 잠깐만 켬
;   (와이파이·플래시 쓰기는 PSRAM 접근을 막는다) · 화면 초기화 '뒤에' heap_caps_malloc_extmem_enable(64).
custom_sdkconfig =
  CONFIG_SPIRAM_XIP_FROM_PSRAM=y
  CONFIG_SPIRAM_RODATA=y
  CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
  CONFIG_ESP32S3_DATA_CACHE_64KB=y
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  CONFIG_FREERTOS_HZ=1000
  CONFIG_LCD_RGB_RESTART_IN_VSYNC=n

lib_deps =
  lvgl/lvgl@8.3.11
  bblanchon/ArduinoJson@^7.2.0

[env:board]
build_flags = ${env.build_flags} -DESP_PANEL_USE_1024_600_LCD=0 -DBOARD_7B=0

[env:board7b]
build_flags = ${env.build_flags} -DESP_PANEL_USE_1024_600_LCD=1 -DBOARD_7B=1
; 7B(1024x600)만 더하는 설정(2026-10-18):
;  - (2026-10-18 시험 후 보류) PSRAM·플래시 120MHz: 이 Arduino 빌드에서는 앱 시작 때 멈춰 재부팅이 반복됐다. 80MHz 로 둔다.
;    아래는 시험 당시 메모: PSRAM·플래시 120MHz: Waveshare 공식 7B 설정·공장 프로그램과 같다. 화면을 30MHz(초당 약 33장)로 올려 떨림을 줄이려면 필요하다.
;    ESP-IDF 가 '실험 기능'으로 분류(EXPERIMENTAL_FEATURES 필요), 65°C 넘는 곳에서는 불안정할 수 있다. 플래시와 PSRAM 속도는 같아야 한다.
;  - MBEDTLS_EXTERNAL_MEM_ALLOC: HTTPS(암호화) 메모리를 PSRAM 에서 받는다. 1024 화면은 내부 RAM 을 더 써서
;    'esp-aes: Failed to allocate memory' 로 시간표 받기가 실패했다(내부 RAM 52KB 남음).
;  아래 값은 Waveshare 공식 7B 예제 examples/ESP-IDF/13_lvgl_v8_demo/sdkconfig.defaults 와 같게 맞췄다
;  (온도 보정 5초 · 플래시 HPM · DC_AWARE · 성능 최적화). 프레임버퍼 2장은 src/esp_lv_adapter_arduino.cpp.
; board_build.f_flash 는 80MHz 그대로 둔다(esptool 머리글은 120m 을 받지 않는다). 120MHz 전환은 CONFIG_ESPTOOLPY_FLASHFREQ_120M 이 한다.
custom_sdkconfig =
  ${env.custom_sdkconfig}
  CONFIG_COMPILER_OPTIMIZATION_PERF=y
  CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
