<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림판 시뮬레이터</title>
<!--
  교실 알림판 화면 시뮬레이터 — 보드에 굽기(35분) 전에 화면 모습을 미리 본다.
  firmware/src/main.cpp 의 배치 계산(layoutClock·buildUI·renderToday·renderWeek)과 색(#define)·글꼴 크기·줄 높이를 그대로 옮겼다.
  펌웨어의 화면 코드를 고치면 이 파일의 같은 이름 부분도 같이 고친다(함수 이름을 펌웨어와 같게 두었다).
  열기: 7inch 폴더에서  python -m http.server 8765  →  http://localhost:8765/tools/sim/
-->
<style>
  @font-face { font-family: Pret; src: url("../../firmware/fonts/src/Pretendard-SemiBold.otf") format("opentype"); }
  :root { --ui-bg: #f4f1ec; --ui-fg: #2a2320; --ui-sub: #6b5e55; --ui-line: #ddd3c4; --ui-acc: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ui-bg); color: var(--ui-fg); font-family: system-ui, "Malgun Gothic", sans-serif; }
  header { padding: 14px 20px 6px; }
  header h1 { font-size: 18px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--ui-sub); font-size: 13px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--ui-line); font-size: 14px; }
  .bar label { display: inline-flex; gap: 6px; align-items: center; }
  .bar fieldset { border: 1px solid var(--ui-line); border-radius: 8px; padding: 4px 10px; margin: 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .bar legend { font-size: 12px; color: var(--ui-sub); padding: 0 4px; }
  select, input[type=time] { font: inherit; padding: 2px 6px; }
  .stage { padding: 16px 20px 30px; overflow: auto; }
  .frame { display: inline-block; padding: 14px; background: #111; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #screen { position: relative; overflow: hidden; font-family: Pret, sans-serif; transform-origin: 0 0; }
  #screen div { position: absolute; }
  .t { white-space: pre; overflow: hidden; }
  .dot { text-overflow: ellipsis; }
  .note { font-size: 13px; color: var(--ui-sub); margin-top: 10px; max-width: 1060px; line-height: 1.5; }
  .note b { color: var(--ui-fg); }
</style>
</head>
<body>
<header>
  <h1>교실 알림판 시뮬레이터</h1>
  <p>보드 화면을 실제 픽셀 크기로 미리 봅니다. 화면 안의 탭(시간표·시계·찾기·설정)도 눌러 볼 수 있습니다.</p>
</header>
<div class="bar">
  <label>용도 <select id="who"><option value="teacher">교실·교사용</option><option value="principal">교장실용</option></select></label>
  <label class="pOnly">미세먼지 <select id="dust"><option value="0">좋음</option><option value="1">보통</option><option value="2">나쁨</option><option value="3">매우 나쁨</option></select></label>
  <label class="pOnly">기온 <input type="number" id="temp" value="23" min="-15" max="40" style="width:56px">°</label>
  <label>보드 <select id="board"><option value="1024">7B · 1024×600</option><option value="800">7 · 800×480</option></select></label>
  <label><input type="checkbox" id="soft" checked> 부드러운 디자인(UI_SOFT)</label>
  <label>지금 시각 <input type="time" id="time" value="10:47"></label>
  <label><input type="checkbox" id="h12"> 12시간 표시</label>
  <label>확대 <select id="zoom"><option value="1">100%</option><option value="0.75">75%</option><option value="1.25">125%</option></select></label>
  <fieldset><legend>시계 화면 보이기</legend>
    <label><input type="checkbox" class="show" data-b="1" checked>날씨</label>
    <label><input type="checkbox" class="show" data-b="2" checked>미세먼지</label>
    <label><input type="checkbox" class="show" data-b="4" checked>할 일</label>
    <label><input type="checkbox" class="show" data-b="8" checked>급식</label>
    <label><input type="checkbox" class="show" data-b="16" checked>시간표</label>
    <label><input type="checkbox" class="show" data-b="32" checked>D-day</label>
  </fieldset>
</div>
<div class="stage">
  <div class="frame"><div id="screen"></div></div>
  <div class="note">
    <b>참고</b> — 글꼴은 보드와 같은 Pretendard SemiBold, 크기·줄 높이·좌표는 펌웨어 계산식 그대로입니다.
    날씨 그림은 자리만 표시합니다(보드는 52px 그림). 브라우저의 글자 다듬기 때문에 1~2px 차이가 날 수 있습니다.
    자료는 가짜 예시입니다(실제 보드는 사이트에서 받은 시간표).
  </div>
</div>
<script>
// ───────── 펌웨어 색 (main.cpp #define) ─────────
const PAL = {
  soft: { C_PRIMARY:0xdc2626, C_TEXT:0x2a2320, C_MUTED:0x5c5048, C_LIGHT:0x7a6d60, C_BG:0xf6f1e9, C_SURF:0xffffff, C_ALT:0xfbf8f3, C_BORDER:0xdcd2c4, C_LINE:0xece5da, C_EMERALD:0x10b981, C_ROSE:0xe11d48,
          D_BG:0x1c1714, D_PANEL:0x26201c, D_ROW:0x342c26, D_LINE:0x4a4038, D_TEXT:0xfaf5ee, D_SUB:0xe2d8cc, D_MUTED:0xb8ab9c, NOW_ROW:0xfff4e0, NOW_TAG:0xfbbf24, NOW_TX:0x2a2320, NEXT_BD:0xfacc15, MEAL:0xe2d8cc },
  classic: { C_PRIMARY:0xdc2626, C_TEXT:0x0f172a, C_MUTED:0x475569, C_LIGHT:0x64748b, C_BG:0xf1f5f9, C_SURF:0xffffff, C_ALT:0xf8fafc, C_BORDER:0xcbd5e1, C_LINE:0xe2e8f0, C_EMERALD:0x10b981, C_ROSE:0xe11d48,
          D_BG:0x0b1120, D_PANEL:0x111827, D_ROW:0x1e293b, D_LINE:0x334155, D_TEXT:0xffffff, D_SUB:0xcbd5e1, D_MUTED:0x94a3b8, NOW_ROW:0xf1f5f9, NOW_TAG:0xb91c1c, NOW_TX:0xffffff, NEXT_BD:0, MEAL:0xe2e8f0 },
};
const STYLE = { n:0x34d399, d:0xfb923c, j:0x818cf8, x:0xf87171, c:0xa78bfa, e:0xf472b6, f:0x38bdf8, h:0xf87171 };   // styleOf().border
// 글꼴: 크기와 줄 높이(src/fonts/*.c 의 line_height)
const FONT = { kr14:[14,16], kr16:[16,17], kr20:[20,21], kr28:[28,29], num120:[120,88], num140:[140,102], num36:[36,25], num44:[44,32] };
const PERIOD_START = ["08:40","09:40","10:40","11:40","13:30","14:40","15:40"];
const DOW = ["월","화","수","목","금"];

// ───────── 예시 자료 (data-format.md 모양) ─────────
const TT = { name:"김선생", kind:"teacher", hours:"16", home:"2-3",
  days: [
    { dow:"월", cells:[["n","수학","2-3",""],["n","수학","2-5",""],["",""],["n","수학","1-2",""],["j","공강지도","2-1 · 3층","지도"],["n","수학","2-4",""],["",""]], lunch:"" },
    { dow:"화", cells:[["",""],["n","수학","1-1",""],["n","수학","2-3",""],["c","창체","2-3",""],["n","수학","2-6",""],["",""],["n","수학","1-4",""]], lunch:"1" },
    { dow:"수", cells:[["n","수학","2-5",""],["d","수학","2-4","당겨옴"],["",""],["n","수학","1-2",""],["x","수학","2-6","결강"],["n","수학","2-3",""],["",""]], lunch:"" },
    { dow:"목", cells:[["n","수학","1-1",""],["",""],["n","수학","2-3",""],["e","시험감독","3-2",""],["n","수학","2-5",""],["",""],["j","보강","1-3","보강"]], lunch:"" },
    { dow:"금", cells:[["n","수학","2-3",""],["n","수학","2-6",""],["n","수학","1-4",""],["",""],["n","수학","2-4",""],["f","학년 행사","강당",""],["",""]], lunch:"1" },
  ] };
const TODAY = 4;   // 금요일
const WX = [{ name:"맑음", tmax:23, tmin:14, now:18, pop:0 }, { name:"구름 많음", tmax:21, tmin:13, pop:40 }];

// ───────── 상태 ─────────
const st = { W:1024, H:600, soft:true, view:"clock", nm:10*60+47, h12:false, show:63, who:"teacher", dust:0, temp:23, guest:"free" };
const $ = id => document.getElementById(id);
const hex = v => "#" + v.toString(16).padStart(6, "0");
const toMin = s => +s.slice(0,2) * 60 + +s.slice(3,5);

function rebuild() {
  const P = st.soft ? PAL.soft : PAL.classic;
  const W = st.W, H = st.H, K = W / 800, S = v => Math.round(v * K), big = W > 800, small = W <= 800;
  const R = r => (st.soft && r >= 10) ? r : 0;           // UI_FANCY 0 · UI_SOFT 규칙
  const RP = r => st.soft ? 999 : 0;                     // 알약
  const FM = big ? "kr16" : "kr14", FCLK = big ? "num140" : "num120", FTEMP = big ? "num44" : "num36";
  const scr = $("screen"); scr.innerHTML = "";
  scr.style.width = W + "px"; scr.style.height = H + "px"; scr.style.background = hex(P.D_BG);
  scr.style.transform = `scale(${$("zoom").value})`;
  scr.parentElement.style.width = (W * $("zoom").value + 28) + "px"; scr.parentElement.style.height = (H * $("zoom").value + 28) + "px";

  // 도구: 상자와 글자(LVGL box()/label() 흉내)
  function box(parent, x, y, w, h, bg, border, radius, extra) {
    const d = document.createElement("div");
    Object.assign(d.style, { left:x+"px", top:y+"px", width:w+"px", height:h+"px", background: bg == null ? "transparent" : hex(bg), borderRadius: (radius||0) + "px" });
    if (border) d.style.boxShadow = `inset 0 0 0 1px ${hex(border)}`;
    if (extra) Object.assign(d.style, extra);
    (parent || scr).appendChild(d); return d;
  }
  function label(parent, font, color, text, opt = {}) {
    const d = document.createElement("div"); d.className = "t";
    const [sz, lh] = FONT[font];
    Object.assign(d.style, { fontSize: sz + "px", lineHeight: lh + (opt.ls || 0) + "px", color: hex(color) });
    if (opt.w != null) { d.style.width = opt.w + "px"; d.classList.add("dot"); }
    if (opt.h != null) d.style.height = opt.h + "px";
    if (opt.wrap) { d.style.whiteSpace = "pre-wrap"; d.style.wordBreak = "keep-all"; }
    if (opt.align) d.style.textAlign = opt.align;
    if (opt.bg != null) { d.style.background = hex(opt.bg); d.style.padding = `${opt.pv||0}px ${opt.ph||0}px`; d.style.borderRadius = (opt.r||0)+"px"; if (opt.bd) d.style.boxShadow = `inset 0 0 0 1px ${hex(opt.bd)}`; }
    d.innerHTML = text;
    (parent || scr).appendChild(d); return d;
  }
  // 정렬 도우미: 부모 기준 가운데·오른쪽 등 (그린 뒤 크기를 재서 놓는다)
  function place(el, parent, how, ox = 0, oy = 0) {
    const pw = parent.offsetWidth, ph = parent.offsetHeight, w = el.offsetWidth, h = el.offsetHeight;
    const x = { L: 0, C: (pw - w) / 2, R: pw - w }[how[1]], y = { T: 0, M: (ph - h) / 2, B: ph - h }[how[0]];
    el.style.left = Math.round(x + ox) + "px"; el.style.top = Math.round(y + oy) + "px";
  }
  const nm = st.nm, day = TT.days[TODAY], teacher = TT.kind === "teacher";
  let nowP = -1, nextP = -1;
  PERIOD_START.forEach((s, p) => { const a = toMin(s); if (nm >= a && nm < a + 50) nowP = p; if (nextP < 0 && a > nm) nextP = p; });
  const lunchNow = nm >= toMin("12:30") && nm < toMin("13:30");
  const hh = Math.floor(nm / 60), mm = nm % 60;
  const clockTxt = st.h12 ? `${(hh % 12) || 12}:${String(mm).padStart(2,"0")}` : `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  const ampm = st.h12 ? (hh < 12 ? "오전" : "오후") : "";

  if (st.view === "clock" && st.who === "principal") { buildPrincipal(); return; }
  if (st.view === "clock") { buildClock(); return; }

  // ── 교장실용 평소 화면 (교장실 회의 TOP 3: 학교 한눈판 · 안전 신호등 · 손님 맞이 상태판) ──
  // 왼쪽: 큰 시계 · 날짜 · '학교 지금'(교시 링 + 집계 숫자) · 날씨·급식. 오른쪽: 오늘 일정 · 안전 신호등 · 교장실 상태.
  // 선생님 위치는 개인별로 받지 않고 집계 숫자만 쓴다(감시처럼 보이지 않게).
  function buildPrincipal() {
    const view = box(scr, 0, 0, W, H, P.D_BG);
    const CM = S(12), PH = H - 2 * CM, Pp = S(20), LW = S(416), CW = LW - 2 * Pp;
    const left = box(view, CM, CM, LW, PH, P.D_PANEL, P.D_LINE, R(16));
    const bigc = label(left, FCLK, P.D_TEXT, clockTxt); place(bigc, left, "TC", 0, S(18));
    const DATE_Y = S(18) + (big ? FONT[FCLK][1] : 88) + S(12);
    const bd = label(left, "kr28", P.D_SUB, "10월 17일 (금)", { w: LW, align: "center" }); bd.style.left = "0px"; bd.style.top = DATE_Y + "px";
    // 학교 지금: 얇은 링 + 교시 + 집계
    const nowY = DATE_Y + 29 + S(20), nowH = S(118);
    const nc = box(left, Pp, nowY, CW, nowH, P.D_ROW, P.D_LINE, R(14));
    let ring = 0, t1 = "", t2 = "";
    if (nowP >= 0) { const end = toMin(PERIOD_START[nowP]) + 50; ring = (end - nm) / 50; t1 = `${nowP + 1}교시 수업 중`; t2 = `${end - nm}분 남음` + (nextP >= 0 ? ` · ${nextP + 1}교시 ${PERIOD_START[nextP]}` : ""); }
    else if (lunchNow) { ring = (toMin("13:30") - nm) / 60; t1 = "점심시간"; t2 = `${toMin("13:30") - nm}분 남음 · 5교시 13:30`; }
    else if (nextP >= 0) { ring = 1; t1 = nm < toMin(PERIOD_START[0]) ? "수업 전" : "쉬는 시간"; t2 = `${nextP + 1}교시 ${PERIOD_START[nextP]} 시작`; }
    else { t1 = "수업 끝"; t2 = "방과 후"; }
    const RR = S(38), CX = S(14) + RR + 4, CY = nowH / 2, CC = 2 * Math.PI * RR;
    const sv = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    sv.setAttribute("width", CW); sv.setAttribute("height", nowH); sv.style.position = "absolute"; sv.style.left = "0"; sv.style.top = "0";
    sv.innerHTML = `<circle cx="${CX}" cy="${CY}" r="${RR}" fill="none" stroke="${hex(P.D_LINE)}" stroke-width="5"/>
      <circle cx="${CX}" cy="${CY}" r="${RR}" fill="none" stroke="${hex(P.NOW_TAG)}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${CC}" stroke-dashoffset="${CC * (1 - ring)}" transform="rotate(-90 ${CX} ${CY})"/>`;
    nc.appendChild(sv);
    const pn = label(nc, "kr28", P.D_TEXT, nowP >= 0 ? String(nowP + 1) : (lunchNow ? "점" : (nextP >= 0 ? String(nextP + 1) : "–"))); pn.style.left = (CX - pn.offsetWidth / 2) + "px"; pn.style.top = (CY - 15) + "px";
    const tx = CX + RR + S(16);
    label(nc, "kr20", P.D_TEXT, t1).style.cssText += `left:${tx}px;top:${S(16)}px`;
    label(nc, FM, P.D_SUB, t2).style.cssText += `left:${tx}px;top:${S(16) + 28}px`;
    label(nc, FM, P.D_MUTED, "교무실 12명 · 수업 중 34명 · 출장 2명").style.cssText += `left:${tx}px;top:${nowH - S(14) - 18}px`;
    // 날씨·미세먼지·급식 한 줄 카드
    const wy = nowY + nowH + S(12), wh = PH - Pp - wy;
    const wcard = box(left, Pp, wy, CW, wh, P.D_ROW, P.D_LINE, R(14));
    const dustTxt = ["좋음","보통","나쁨","매우 나쁨"][st.dust], dustCol = ["#22c55e","#a3e635","#fb923c","#f87171"][st.dust];
    box(wcard, S(14), S(14), 46, 46, null, null, 23, { background: "radial-gradient(circle at 40% 40%, #fde68a, #f59e0b)" });
    label(wcard, FTEMP, P.D_TEXT, `${st.temp}°`).style.cssText += `left:${S(14) + 60}px;top:${S(12)}px`;
    label(wcard, FM, P.D_SUB, `맑음 · 최고 ${st.temp + 3}° 최저 ${st.temp - 7}°`).style.cssText += `left:${S(14) + 60}px;top:${S(12) + 38}px`;
    label(wcard, FM, P.D_SUB, `<span style="color:${dustCol}">● 미세먼지 ${dustTxt}</span>`).style.cssText += `left:${CW / 2 + S(10)}px;top:${S(16)}px`;
    label(wcard, FM, P.D_MUTED, "급식 12:30 · 812 Kcal").style.cssText += `left:${CW / 2 + S(10)}px;top:${S(16) + 26}px`;
    label(wcard, FM, P.D_SUB, "잡곡밥 · 쇠고기미역국 · 제육볶음 · 계란말이 · 배추김치", { w: CW - S(28) }).style.cssText += `left:${S(14)}px;top:${S(12) + 70}px`;
    box(wcard, S(14), wh - S(44), CW - S(28), 1, P.D_LINE);
    label(wcard, FM, P.D_MUTED, "학교 소식 · 중간고사 D-12 · 2학년 진로 특강 5교시", { w: CW - S(28) }).style.cssText += `left:${S(14)}px;top:${wh - S(32)}px`;

    // 오른쪽
    const RX = CM + LW + CM, RW = W - RX - CM;
    const right = box(view, RX, CM, RW, PH, P.D_PANEL, P.D_LINE, R(16));
    label(right, "kr16", P.D_TEXT, "오늘 일정").style.cssText += `left:${S(16)}px;top:${S(14)}px`;
    if (st.show & 32) place(label(right, "kr14", 0xfecaca, "수능 D-33", { bg: 0x7f1d1d, bd: 0xef4444, ph: 10, pv: 2, r: RP(11) }), right, "TR", -S(12), S(11));
    const SCHED = [["08:20","아침 협의회","교무실"],["10:30","학부모 상담","교장실"],["13:30","2학년 진로 특강","강당"],["14:00","교육청 장학사 방문","교장실"],["16:00","학교운영위원회","회의실"]];
    const ROW_Y0 = S(44), ROW_X = S(12), ROW_W = RW - 2 * ROW_X, RP_ = S(40), RH_ = RP_ - S(6), TW = S(64);
    let nextI = SCHED.findIndex(s => toMin(s[0]) > nm);
    SCHED.forEach((s, i) => {
      const past = toMin(s[0]) + 50 <= nm, cur = !past && toMin(s[0]) <= nm, nxt = !cur && i === nextI;
      const row = box(right, ROW_X, ROW_Y0 + i * RP_, ROW_W, RH_, cur ? P.NOW_ROW : P.D_ROW, null, R(8), { boxShadow: `inset 0 0 0 ${nxt ? 2 : 1}px ${hex(cur ? P.NOW_ROW : nxt ? P.NEXT_BD : P.D_LINE)}` });
      const tb = box(row, S(6) - 1, 4, TW, RH_ - 8, cur ? P.NOW_TAG : P.D_LINE, null, R(6));
      place(label(tb, "kr16", cur ? P.NOW_TX : (past ? P.D_MUTED : P.D_SUB), s[0]), tb, "MC");
      place(label(row, "kr16", cur ? P.C_TEXT : past ? P.D_MUTED : P.D_TEXT, s[1]), row, "ML", TW + S(18));
      place(label(row, FM, cur ? P.C_MUTED : P.D_MUTED, s[2], { w: S(90), align: "right" }), row, "MR", -S(14));
    });
    // 안전 신호등
    const heat = st.temp >= 33 ? 2 : st.temp >= 31 ? 1 : 0, cold = st.temp <= -5 ? 2 : st.temp <= 0 ? 1 : 0, dl = st.dust >= 3 ? 2 : st.dust >= 2 ? 1 : 0;
    const level = Math.max(dl, heat, cold), lvCol = [0x34d399, 0xfbbf24, 0xf87171][level];

      const row = box(right, ROW_X, ROW_Y0 + r * ROW_PITCH, ROW_W, ROW_H, now ? P.NOW_ROW : P.D_ROW, null, R(8), { boxShadow: `inset 0 0 0 ${next ? 2 : 1}px ${hex(border)}` });
      const pb = box(row, S(6) - 1, Math.floor((ROW_H - (ROW_H - 8)) / 2), PW, ROW_H - 8, now ? P.NOW_TAG : P.D_LINE, null, R(6));
      const ptxt = p < 0 ? (now ? `점심\n${toMin("13:30") - nm}분 남음` : "점심") : (now ? `${p + 1}교시\n${toMin(PERIOD_START[p]) + 50 - nm}분 남음` : `${p + 1}교시\n${PERIOD_START[p]}`);
      place(label(pb, FM, now ? P.NOW_TX : P.D_SUB, ptxt, { align: "center" }), pb, "MC");
      const a = label(row, "kr16", colA, A); a.style.maxWidth = S(150) + "px"; a.classList.add("dot"); place(a, row, "ML", PW + S(18));
      if (G) { const g = label(row, "kr14", 0xffffff, G, { bg: 0xc2410c, ph: 5, r: RP(6) }); place(g, row, "ML", a.offsetLeft + a.offsetWidth + 8); }
      place(label(row, FM, colB, B, { w: S(110), align: "right" }), row, "MR", -S(14));
    }
  }
}

// ───────── 조작 ─────────
function readCtl() {
  const b = $("board").value; st.W = b === "1024" ? 1024 : 800; st.H = b === "1024" ? 600 : 480;
  st.soft = $("soft").checked; st.h12 = $("h12").checked;
  st.who = $("who").value; st.dust = +$("dust").value; st.temp = +$("temp").value || 0;
  document.querySelectorAll(".pOnly").forEach(e => e.style.display = st.who === "principal" ? "" : "none");
  const [h, m] = $("time").value.split(":").map(Number); st.nm = h * 60 + m;
  st.show = [...document.querySelectorAll(".show")].reduce((a, c) => a | (c.checked ? +c.dataset.b : 0), 0);
  rebuild();
}
document.querySelectorAll("select,input").forEach(e => e.addEventListener("input", readCtl));
document.fonts.load('20px Pret').then(readCtl, readCtl);
</script>
