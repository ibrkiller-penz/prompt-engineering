<!doctype html>
<html lang="ko" data-surface="phone" data-unit="u1" data-site="student">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학생 폰 시안</title>
<link rel="stylesheet" href="../../../../node_modules/katex/dist/katex.min.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div class="app-phone">
  <div class="site-band"></div>
  <header class="topbar">
    <button class="btn btn-ghost" aria-label="뒤로">‹</button>
    <div class="title">Ⅰ-1 인공지능의 개념과 역사</div>
    <button class="btn btn-ghost" aria-label="읽기 설정">가</button>
  </header>

  <main class="page stack-lg">
    <section class="card card-hero stack">
      <div class="eyebrow">이어서 공부하기</div>
      <h1 class="h2">인공 뉴런은 어떻게 판단할까요?</h1>
      <div class="meter" aria-label="진행 5/9"><i style="width:55%"></i></div>
      <p class="muted" style="margin:0;font-size:var(--t-sm)">개념 3/6 읽음 · 기본 문제 4/10 맞힘</p>
      <button class="btn btn-primary btn-block">이어서 하기 →</button>
    </section>

    <section class="stack">
      <div class="row wrap"><span class="chip is-accent">개념 ③</span><span class="chip">약 4분</span></div>
      <h2 class="h2">가중합과 임곗값</h2>
      <div class="prose">
        <p>뉴런은 입력마다 <button class="term">가중치</button>를 곱해 더한 값이 기준보다 크거나 같으면 1을 내보내요.</p>
      </div>
      <div class="math-block scroll-x" id="m1"></div>
      <div class="callout aha"><b>💡 한 줄 정리</b>같을 때도 1이에요. <span id="m2"></span> 이니까요.</div>
      <div class="callout warn"><b>⚠️ 자주 하는 오해</b>가중치가 크다고 항상 1이 나오는 건 아니에요.</div>
      <div class="scroll-x"><table class="tbl"><tr><th>입력</th><th>가중치</th><th>곱</th><th>설명</th></tr><tr><td>1</td><td>0.6</td><td>0.6</td><td>맑으면 1, 흐리면 0이에요</td></tr><tr><td>0</td><td>0.3</td><td>0</td><td>친구가 오면 1이에요</td></tr></table></div>
    </section>

    <section class="card stack">
      <div class="eyebrow">바로 확인</div>
      <p style="margin:0">가중합이 <span id="m3"></span>이고 임곗값이 0.5일 때 출력은?</p>
      <div>
        <button class="opt is-ok"><span class="key">1</span>1 <span class="mark">✓ 맞았어요</span></button>
        <button class="opt"><span class="key">2</span>0</button>
        <button class="opt is-bad"><span class="key">3</span>알 수 없어요 <span class="mark">✗ 다시 봐요</span></button>
      </div>
    </section>
  </main>

  <nav class="bottombar" aria-label="레슨 진행">
    <div class="steps"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i><i></i><i></i><i></i><i></i></div>
    <div class="inner">
      <button class="btn" aria-label="이전 단계">‹ 이전</button>
      <div class="grow">5/9 · 개념 ③</div>
      <button class="btn btn-primary">다음 →</button>
    </div>
  </nav>
</div>
<script src="../../../../node_modules/katex/dist/katex.min.js"></script>
<script>
katex.render("y=\\begin{cases}1 & (w_1x_1+w_2x_2 \\ge \\theta)\\\\ 0 & (w_1x_1+w_2x_2 < \\theta)\\end{cases}", document.getElementById('m1'), {displayMode:true, output:'htmlAndMathml'});
katex.render("7 \\ge 7", document.getElementById('m2'), {output:'htmlAndMathml'});
katex.render("0.6", document.getElementById('m3'), {output:'htmlAndMathml'});
</script>
</body>
</html>
