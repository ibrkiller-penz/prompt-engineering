<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공은 높이에 따라 얼마나 빨리 굴러 내려올까? · 온라인 과학 체험</title><meta property="og:type" content="website">
<meta property="og:site_name" content="살빠진 임선생과 함께하는 교육자료">
<meta property="og:title" content="공은 높이에 따라 얼마나 빨리 굴러 내려올까? · 온라인 과학 체험">
<meta property="og:description" content="높은 곳에서 굴러 내려온 공은 바닥에서 얼마나 빨라질까?">
<meta property="og:url" content="https://ai-study-science.web.app/exp/C8.html">
<meta property="og:image" content="https://ai-study-science.web.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="../css/common.css"></head>
<body><div class="wrap"><div id="app"></div></div>
<script src="../js/common.js"></script>
<script>
var EXP={
 id:"C8",
 predict:{q:"공을 높이 H에서 놓아 골짜기 맨 아래를 지날 때, 높이를 2배로 하면 속도는?",options:["속도도 2배","속도는 약 1.4배(√2배)","속도는 그대로"],answer:1,
  feedback:["2배가 되려면 높이가 4배여야 해요. 속도는 높이의 제곱근에 비례해요.","맞아요. 속력은 √(2gh)라서 높이가 2배면 속력은 √2배예요.","높이가 달라지면 속도도 달라져요. 위치에너지가 운동에너지로 바뀌어요."]},
 steps:["시작 높이 슬라이더로 공을 올릴 높이를 정해요.","'출발'을 누르면 골짜기를 따라 공이 굴러가요.","위쪽 막대로 위치 에너지와 운동 에너지가 어떻게 바뀌는지 확인해요."],
 observe:["공이 가장 높이 올라간 순간, 운동 에너지 막대는 어떻게 보이나요?","바닥을 지날 때 위치 에너지 막대는 얼마나 줄었나요?","공이 반대쪽 언덕에 올라갈 때 처음 높이까지 올라가나요?"],
 more:["마찰이 있다면 공이 처음 높이까지 올라갈까요? 예상해 보세요.","종이 골짜기를 만들어 공을 굴려 보고, 높이를 바꿔 가며 속도가 어떻게 달라지는지 비교해 보세요."],
 why:{easy:["공이 높은 곳에 있을수록 위치 에너지가 커요. 굴러 내려갈 때 그 에너지가 움직이는 에너지(운동 에너지)로 바뀌어요.","마찰을 무시하면 전체 에너지는 같아서 공은 처음 높이까지 반대쪽 언덕을 올라갈 수 있어요. 실제로는 마찰 때문에 조금씩 줄어요."],
  detail:["역학적 에너지 보존: mgh = ½mv² + mgy 예요. 바닥(y=0)에서의 속력은 v = √(2gh)예요.","이 체험은 골짜기 곡선 y = x²에서 마찰을 무시하고 계산한 근사예요. 질량은 식에서 약분되어 속력에 영향이 없어요. 그림은 세로 방향을 늘려 그렸어요."]},
 init:function(el){
  el.innerHTML='<canvas id="cv" role="img" aria-label="U자 골짜기 위를 공이 굴러가는 그림과 위치 에너지, 운동 에너지 막대"></canvas>'+
   '<div class="controls"><label>시작 높이 H <input id="hs" type="range" min="0.5" max="6" step="0.1" value="3" aria-label="시작 높이"><span class="readout" id="rd"></span></label></div>'+
   '<div class="controls"><button class="primary" id="go" type="button">출발</button><button id="rs" type="button">다시 놓기</button></div>'+
   '<p class="note" id="info" aria-live="polite"></p>';
  var cv=el.querySelector("#cv"),hs=el.querySelector("#hs"),rd=el.querySelector("#rd"),info=el.querySelector("#info"),G=10,H,x,d,run=false,css=getComputedStyle(document.documentElement);
  function reset(){H=+hs.value;x=-Math.sqrt(H)+1e-3;d=1;run=false;rd.textContent="H = "+H.toFixed(1)+" m";draw()}
  function step(dt){var lim=Math.sqrt(H),inside=Math.max(H-x*x,0),v=Math.sqrt(2*G*inside);x+=d*v/Math.sqrt(1+4*x*x)*dt;
   if(x>=lim){x=lim-1e-3;d=-1}else if(x<=-lim){x=-lim+1e-3;d=1}}
  function frame(){if(!run)return;if(!document.body.contains(cv))return;for(var i=0;i<4;i++)step(1/240);draw();requestAnimationFrame(frame)}
  function draw(){
   var s=Sci.fit(cv,.75),c=s.c,w=s.w,h=s.h,ink=getComputedStyle(document.body).color,brand=css.getPropertyValue("--brand").trim(),sub=css.getPropertyValue("--sub").trim();
   c.clearRect(0,0,w,h);
   var sx=w*.42/2.6,sy=h*.5/6,cx=w/2,base=h*.8,Emax=G*6;
   c.strokeStyle=ink;c.lineWidth=3;c.beginPath();var first=true;
   for(var X=-2.6;X<=2.6001;X+=.05){var px=cx+X*sx,py=base-X*X*sy;if(first){c.moveTo(px,py);first=false}else c.lineTo(px,py)}
   c.stroke();
   c.save();c.setLineDash([5,5]);c.strokeStyle=sub;c.beginPath();c.moveTo(0,base-H*sy);c.lineTo(w,base-H*sy);c.stroke();c.restore();
   c.fillStyle=sub;c.font="13px sans-serif";c.fillText("시작 높이",6,base-H*sy-6);
   var bx=cx+x*sx,by=base-x*x*sy;
   c.fillStyle=brand;c.beginPath();c.arc(bx,by-10,9,0,Math.PI*2);c.fill();
   var PE=G*x*x,KE=G*H-PE;
   function bar(y,label,val,col){c.fillStyle=ink;c.font="13px sans-serif";c.fillText(label,8,y+11);c.fillStyle=col;c.fillRect(w*.36,y,w*.6*val/Emax,12);c.strokeStyle=sub;c.strokeRect(w*.36,y,w*.6,12)}
   bar(8,"위치 에너지",PE,brand);bar(28,"운동 에너지",KE,sub);
   var v=Math.sqrt(2*G*Math.max(H-x*x,0));
   info.textContent="지금 속력 약 "+v.toFixed(1)+" m/s (근사, 마찰 무시)";
  }
  hs.addEventListener("input",reset);
  el.querySelector("#go").addEventListener("click",function(){if(!run){run=true;requestAnimationFrame(frame)}Exp.reveal()});
  el.querySelector("#rs").addEventListener("click",reset);
  window.addEventListener("resize",draw);reset();
 }
};
Sci.initExp();
</script></body></html>
