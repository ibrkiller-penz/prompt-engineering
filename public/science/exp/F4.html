<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>계절은 왜 바뀔까 · 온라인 과학 체험</title><meta property="og:type" content="website">

<meta property="og:title" content="계절은 왜 바뀔까 · 온라인 과학 체험">
<meta property="og:description" content="여름은 지구가 태양에 가까워서일까?">
<meta property="og:url" content="https://ai-study-science.web.app/exp/F4.html">
<meta property="og:image" content="https://ai-study-science.web.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="../css/common.css">
<style>
.stat{display:flex;gap:8px 16px;flex-wrap:wrap;margin:8px 0 0;font-size:15px}.stat b{font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}.bar span.l{width:7.5em;flex:none}
.bar .t{flex:1;height:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--brand)}
.bar b{width:5.5em;flex:none;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="wrap"><div id="app"></div></div>
<script src="../js/common.js"></script>
<script>
var EXP={
 id:"F4",
 predict:{q:"우리나라에서 여름이 덥고 겨울이 추운 가장 큰 이유는 무엇일까요?",options:["여름에는 지구가 태양에 더 가까워서","지구의 자전축이 기울어 있어서","여름과 겨울에는 태양이 내는 열이 달라서"],answer:1,
  feedback:["흔한 오해예요. 우리나라가 더운 여름에 지구는 오히려 태양에서 조금 더 멀어요. 아래에서 확인해 보세요.","맞아요! 자전축이 기울어 있어서 해가 높이 뜨는 정도와 낮의 길이가 달라져요.","태양이 내는 에너지는 계절에 따라 거의 변하지 않아요. 아래에서 확인해 보세요."]},
 steps:["'날짜' 슬라이더(← → 키)를 움직여 지구가 태양 둘레를 도는 모습을 봐요. 지구의 자전축은 늘 같은 방향(북극성 쪽)을 가리켜요.","아래 숫자에서 한낮 해의 높이, 낮의 길이, 태양까지의 거리를 확인하세요.","'기울기 0°' 버튼을 눌러 자전축이 기울지 않은 지구를 상상해 보세요. 계절이 생길까요?","다시 '실제 23.4°'로 돌려 놓고 6월과 12월의 거리를 비교해 보세요."],
 observe:["북반구가 여름일 때 북극은 태양 쪽으로 기울어 있나요, 반대쪽인가요?","1년 동안 태양까지의 거리는 얼마나 달라지나요? 가장 가까운 때는 언제인가요?","기울기를 0°로 하면 한낮 해의 높이와 낮의 길이는 어떻게 되나요?","낮이 길어지면 같은 곳이 받는 햇빛의 양은 어떻게 될까요?"],
 more:["지구본과 전등으로 해 보세요. 지구본의 축을 기울인 채(방향은 고정) 전등 둘레를 한 바퀴 돌며 우리나라가 있는 쪽이 전등을 얼마나 마주 보는지 관찰하세요.","한 달에 한 번 같은 시각에 한낮 그림자 길이를 재서 계절에 따라 달라지는지 보세요(F1 체험과 연결돼요).","남반구의 계절은 우리와 같을까요? 12월 그림에서 남반구는 어떤 상태인지 생각해 보세요."],
 why:{easy:["지구는 약간 기울어진 채로 태양 둘레를 돌아요. 기울어진 방향은 1년 내내 거의 같아요.","북극 쪽이 태양을 향해 기울어진 때(6월 즈음)에는 북반구에 햇빛이 더 수직에 가깝게 내려오고 낮도 길어서 여름이에요.","북극 쪽이 태양 반대로 기울어진 때(12월 즈음)에는 햇빛이 비스듬히 들어오고 낮이 짧아서 겨울이에요.","지구와 태양 사이 거리는 1년 동안 겨우 3% 정도만 달라져요. 그리고 가장 가까운 때는 오히려 1월 초, 북반구의 겨울이에요. 그래서 거리 때문이 아니에요.","북반구가 여름이면 남반구는 겨울이에요. 거리가 이유라면 지구 전체가 같은 계절이어야 하는데 그렇지 않아요."],
  detail:["자전축 기울기 ε ≈ 23.4°일 때, 태양의 적위 δ는 sin δ = sin ε · sin λ 예요(λ는 태양의 황경, 춘분 0°). 하지엔 δ ≈ +23.4°, 동지엔 −23.4°.","위도 φ인 곳의 한낮(남중) 고도는 α = 90° − φ + δ. 같은 곳에서 하지와 동지의 고도 차가 약 2ε ≈ 47°예요.","낮의 길이는 cos H₀ = −tan φ · tan δ 에서 H₀를 구해 2H₀/15°(시간)로 계산해요. 이 체험에서는 대기 굴절과 태양 지름을 무시한 근사값이에요.","같은 양의 햇빛도 비스듬히 들어오면 더 넓은 면적에 퍼져 단위 면적당 에너지가 줄어요(입사각 효과). 여기에 낮의 길이 차이가 더해져서 계절 차이가 커져요.","지구 공전 궤도는 이심률이 약 0.017인 거의 원이에요. 근일점은 1월 초(약 1억 4,710만 km), 원일점은 7월 초(약 1억 5,210만 km)예요. 그림의 궤도는 거리 표시를 위해 '원 모양'으로 단순화했고 궤도 기울어진 모양은 보기 쉽게 비스듬히 그렸어요(모식도)."]},
 init:function(el){
  el.innerHTML='<canvas id="cv" role="img" aria-label="지구가 태양 둘레를 도는 모습. 자전축은 늘 같은 방향으로 기울어 있음"></canvas>'+
   '<div class="controls"><label>날짜 <input id="lam" type="range" min="0" max="359" step="1" value="90" aria-label="1년 중 날짜"><span class="readout" id="rl"></span></label></div>'+
   '<div class="controls" role="group" aria-label="대표 날짜"><button type="button" data-l="0">춘분</button><button type="button" data-l="90">하지</button><button type="button" data-l="180">추분</button><button type="button" data-l="270">동지</button><button id="pl" type="button" aria-pressed="false">1년 돌려 보기</button></div>'+
   '<div class="controls"><label>자전축 기울기 <input id="tilt" type="range" min="0" max="45" step="0.1" value="23.4" aria-label="자전축 기울기(도)"><span class="readout" id="rtl"></span></label></div>'+
   '<div class="controls" role="group" aria-label="기울기 바로 선택"><button type="button" data-t="0">기울기 0°</button><button type="button" data-t="23.4" aria-pressed="true">실제 23.4°</button><button type="button" data-t="45">45°</button></div>'+
   '<div id="info" aria-live="off"></div><p class="note">위도 37°(우리나라 중부) 기준, 근사값이에요. 그림은 모식도로 거리·크기는 실제와 달라요.</p>';
  var cv=el.querySelector("#cv"),lam=el.querySelector("#lam"),tilt=el.querySelector("#tilt"),rl=el.querySelector("#rl"),rtl=el.querySelector("#rtl"),info=el.querySelector("#info"),pl=el.querySelector("#pl");
  var RAD=Math.PI/180,LAT=37*RAD,touched=false,raf=0,last=0,tbtn=[].slice.call(el.querySelectorAll("[data-t]"));
  function dateStr(l){var d=new Date(Date.UTC(2026,2,20)+l/360*365.25*86400000);return (d.getUTCMonth()+1)+"월 "+d.getUTCDate()+"일"}
  function calc(){
   var l=+lam.value*RAD,eps=+tilt.value*RAD,d=Math.asin(Math.sin(eps)*Math.sin(l));
   var alt=90-37+d/RAD,x=-Math.tan(LAT)*Math.tan(d),H0=Math.acos(Math.max(-1,Math.min(1,x)));
   var dist=149.6*(1-0.0167*Math.cos((+lam.value-283)*RAD));
   return {d:d/RAD,alt:alt,len:2*H0/RAD/15,dist:dist}
  }
  function lab(c,t,x,y,al){c.textAlign=al||"center";c.fillText(t,x,y);c.textAlign="left"}
  function draw(){
   var s=Sci.fit(cv,.82),c=s.c,w=s.w,h=s.h,col=getComputedStyle(document.body).color,cx=w/2,cy=h*.5,rx=w*.36,ry=w*.15,er=w*.055;
   c.clearRect(0,0,w,h);c.fillStyle=col;c.strokeStyle=col;c.font=Math.max(11,w*.033)+"px sans-serif";c.lineCap="round";
   var eps=+tilt.value*RAD,l=+lam.value*RAD,ph=l+Math.PI/2;
   c.save();c.setLineDash([5,5]);c.globalAlpha=.6;c.lineWidth=1.5;c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,7);c.stroke();c.restore();
   c.save();c.fillStyle="#ffd43b";c.strokeStyle="#e8890c";c.lineWidth=3;c.beginPath();c.arc(cx,cy,w*.06,0,7);c.fill();c.stroke();c.restore();
   lab(c,"태양",cx,cy+w*.06+15);
   /* 대표 위치 이름 */
   lab(c,"동지 12/21",w-4,cy+er+20,"right");lab(c,"(북반구 겨울)",w-4,cy+er+36,"right");
   lab(c,"춘분 3/20",cx,cy-ry-er-22);
   lab(c,"하지 6/21",4,cy+er+20,"left");lab(c,"(북반구 여름)",4,cy+er+36,"left");
   lab(c,"추분 9/23",cx,cy+ry+er+22);
   [[1,0],[0,-1],[-1,0],[0,1]].forEach(function(p){c.save();c.beginPath();c.arc(cx+p[0]*rx,cy+p[1]*ry,3,0,7);c.fill();c.restore()});
   var ex=cx+rx*Math.cos(ph),ey=cy-ry*Math.sin(ph);
   /* 자전축(늘 오른쪽으로 기울어 같은 방향) */
   var L=er*2.1,ax=Math.sin(eps)*L,ay=Math.cos(eps)*L;
   /* 지구: 어두운 원 + 태양 쪽 반원 밝음 */
   var sa=Math.atan2(cy-ey,cx-ex);
   c.save();c.fillStyle="#4a5a78";c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.arc(ex,ey,er,0,7);c.fill();c.stroke();
   c.fillStyle="#7fc4ff";c.beginPath();c.arc(ex,ey,er,sa-Math.PI/2,sa+Math.PI/2);c.closePath();c.fill();c.beginPath();c.arc(ex,ey,er,0,7);c.stroke();
   c.lineWidth=3;c.beginPath();c.moveTo(ex-ax,ey+ay);c.lineTo(ex+ax,ey-ay);c.stroke();
   c.beginPath();c.arc(ex+ax,ey-ay,4,0,7);c.fill();c.restore();
   c.fillText("북극",ex+ax+6,ey-ay-2);
   c.fillText("자전축은 1년 내내 같은 방향(북극성 쪽)",6,h-8);
   /* 숫자 */
   var r=calc();
   rl.textContent=dateStr(+lam.value);rtl.textContent=(+tilt.value).toFixed(1)+"°";
   var alp=Math.max(0,Math.min(100,r.alt)),ap=alp/90*100,lp=r.len/24*100,dp=(r.dist-140)/20*100;
   info.innerHTML='<div class="bar"><span class="l">한낮 해의 높이</span><span class="t"><i style="width:'+ap+'%"></i></span><b>'+r.alt.toFixed(0)+'°</b></div>'+
    '<div class="bar"><span class="l">낮의 길이</span><span class="t"><i style="width:'+lp+'%"></i></span><b>'+Math.floor(r.len)+'시간 '+Math.round((r.len%1)*60)+'분</b></div>'+
    '<div class="bar"><span class="l">태양까지 거리</span><span class="t"><i style="width:'+dp+'%"></i></span><b>'+(r.dist/100).toFixed(2)+'억 km</b></div>'+
    '<p class="note">거리 막대는 1억 4,000만~1억 6,000만 km 범위예요. 거리는 1년 동안 겨우 3% 정도만 변해요.</p>';
   cv.setAttribute("aria-label",dateStr(+lam.value)+" 지구 위치. 자전축 기울기 "+(+tilt.value).toFixed(1)+"도. 한낮 해의 높이 "+r.alt.toFixed(0)+"도, 낮의 길이 "+r.len.toFixed(1)+"시간, 태양까지 거리 "+(r.dist/100).toFixed(2)+"억 킬로미터");
  }
  function t1(){if(!touched){touched=true;Exp.reveal()}}
  lam.addEventListener("input",function(){t1();draw()});
  tilt.addEventListener("input",function(){t1();tbtn.forEach(function(b){b.setAttribute("aria-pressed",+b.dataset.t===+tilt.value)});draw()});
  [].forEach.call(el.querySelectorAll("[data-l]"),function(b){b.addEventListener("click",function(){lam.value=b.dataset.l;t1();draw()})});
  tbtn.forEach(function(b){b.addEventListener("click",function(){tilt.value=b.dataset.t;tbtn.forEach(function(x){x.setAttribute("aria-pressed",x===b)});t1();draw()})});
  function tick(ts){if(!last)last=ts;var dt=(ts-last)/1000;last=ts;var v=+lam.value+dt*36;if(v>=360)v-=360;lam.value=v;draw();raf=requestAnimationFrame(tick)}
  function stop(){if(raf)cancelAnimationFrame(raf);raf=0;last=0;pl.setAttribute("aria-pressed","false");pl.textContent="1년 돌려 보기"}
  pl.addEventListener("click",function(){if(raf){stop();return}t1();pl.setAttribute("aria-pressed","true");pl.textContent="멈추기";raf=requestAnimationFrame(tick)});
  window.addEventListener("pagehide",stop);document.addEventListener("visibilitychange",function(){if(document.hidden&&raf)stop()});
  draw();window.addEventListener("resize",draw);
 }
};
Sci.initExp();
</script></body></html>
