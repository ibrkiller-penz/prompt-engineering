<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>어디가 균형일까 · 온라인 과학 체험</title><meta property="og:type" content="website">
<meta property="og:site_name" content="살빠진 임선생과 함께하는 교육자료">
<meta property="og:title" content="어디가 균형일까 · 온라인 과학 체험">
<meta property="og:description" content="막대는 어디를 받쳐야 균형이 잡힐까?">
<meta property="og:url" content="https://ai-study-science.web.app/exp/G1.html">
<meta property="og:image" content="https://ai-study-science.web.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="../css/common.css">
<style>.stat{display:flex;gap:8px 16px;flex-wrap:wrap;margin:8px 0 0;font-size:15px}.stat b{font-variant-numeric:tabular-nums}
.grp{border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;margin-top:10px}.grp legend{font-weight:600;padding:0 6px}</style></head>
<body><div class="wrap"><div id="app"></div></div>
<script src="../js/common.js"></script>
<script>
var EXP={
 id:"G1",
 predict:{q:"가벼운 막대의 오른쪽에 무거운 추를 달았어요. 막대가 수평으로 균형 잡히려면 어디를 받쳐야 할까요?",options:["막대의 한가운데","막대 한가운데보다 무거운 추 쪽으로 치우친 곳","막대 한가운데보다 추의 반대쪽으로 치우친 곳"],answer:1,
  feedback:["가운데를 받치면 무거운 쪽이 내려가요. 아래에서 확인해 보세요.","맞아요! 무거운 쪽 가까이를 받쳐야 양쪽을 누르는 힘의 효과가 같아져요.","그러면 무거운 쪽이 더 크게 기울어요. 아래에서 확인해 보세요."]},
 steps:["슬라이더(← → 키)로 '지지점'(막대를 받치는 곳) 위치를 바꿔 막대가 어느 쪽으로 기우는지 보세요.","추 A, 추 B의 무게와 위치를 바꿔 보세요. 막대 자체도 2 kg의 무게가 있어요(굵기가 같은 막대).","'무게중심 보기'를 켜서 ▼ 표시를 확인하고, '균형 점 찾기'를 눌러 보세요."],
 observe:["지지점이 무게중심보다 오른쪽이면 막대는 어느 쪽으로 기울어요?","추를 막대 끝으로 옮기면 무게중심은 어느 쪽으로 움직여요?","같은 무게의 추라도 위치가 지지점에서 멀수록 어떤 일이 생겨요?","추 두 개를 양쪽에 매달아 균형을 맞추려면 어떻게 해야 해요?"],
 more:["30 cm 자와 동전 몇 개로 해 보세요. 자를 연필 위에 올려 균형을 잡고, 한쪽 끝에 동전을 올린 뒤 연필을 어디로 옮겨야 하는지 찾아보세요.","망치나 빗자루를 한 손가락 위에 올려 균형 잡히는 곳을 찾아보세요. 그 곳은 가운데일까요?","시소에서 몸무게가 다른 두 친구가 균형을 이루려면 앉는 자리가 어떻게 달라야 할까요?"],
 why:{easy:["물체는 한 점에 모든 무게가 모여 있는 것처럼 행동해요. 그 점이 무게중심이에요.","막대를 무게중심 바로 아래에서 받치면 양쪽이 서로 돌리려는 힘이 같아서 균형이 잡혀요.","무거운 추를 한쪽에 달면 무게중심이 그쪽으로 옮겨 가요. 그래서 받치는 곳도 추 쪽으로 옮겨야 해요.","같은 무게라도 지지점에서 멀리 있을수록 막대를 더 세게 돌리려 해요."],
  detail:["지지점 p에 대한 힘의 모멘트(돌림힘)는 τ = Σ mᵢ g (xᵢ − p) 예요. 균형은 τ = 0, 즉 p = Σ mᵢxᵢ / Σ mᵢ 일 때예요. 이 위치가 무게중심(질량중심)이에요.","균일한 막대의 질량은 가운데에 모여 있다고 볼 수 있어요. 여기에 추를 달면 무게중심은 (막대 질량×50 + Σ 추 질량×위치) ÷ 전체 질량으로 이동해요.","이 체험은 막대를 이상적인 선으로, 균형 판정은 무게중심과 지지점이 1 cm 안으로 가까울 때로 근사했어요. 실제로는 막대 두께, 마찰, 받침이 닿는 면의 모양 때문에 더 복잡해요."]},
 init:function(el){
  el.innerHTML='<canvas id="cv" role="img" aria-label="막대와 추, 지지점 그림"></canvas>'+
   '<div class="controls"><label>지지점 위치 <input id="pv" type="range" min="0" max="100" step="1" value="50" aria-label="지지점 위치(센티미터)"><span class="readout" id="rp"></span></label></div>'+
   '<fieldset class="grp"><legend>추 A (■)</legend><div class="controls"><label>무게 <input id="ma" type="range" min="0" max="6" step="1" value="3" aria-label="추 A 무게(킬로그램)"><span class="readout" id="rma"></span></label><label>위치 <input id="xa" type="range" min="0" max="100" step="1" value="85" aria-label="추 A 위치(센티미터)"><span class="readout" id="rxa"></span></label></div></fieldset>'+
   '<fieldset class="grp"><legend>추 B (●)</legend><div class="controls"><label>무게 <input id="mb" type="range" min="0" max="6" step="1" value="0" aria-label="추 B 무게(킬로그램)"><span class="readout" id="rmb"></span></label><label>위치 <input id="xb" type="range" min="0" max="100" step="1" value="10" aria-label="추 B 위치(센티미터)"><span class="readout" id="rxb"></span></label></div></fieldset>'+
   '<div class="controls"><button id="com" type="button" aria-pressed="false">무게중심 보기</button><button class="primary" id="find" type="button">균형 점 찾기</button><button id="rst" type="button">처음으로</button></div>'+
   '<p class="stat" id="st"></p><p class="note" id="msg" aria-live="polite" style="min-height:1.6em"></p>';
  var cv=el.querySelector("#cv"),$=function(i){return el.querySelector("#"+i)};
  var pv=$("pv"),ma=$("ma"),xa=$("xa"),mb=$("mb"),xb=$("xb"),st=$("st"),msg=$("msg"),comB=$("com"),showCom=false;
  var BAR=2,ang=0,tgt=0,raf=0,reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function com(){var m=BAR+(+ma.value)+(+mb.value);return (BAR*50+(+ma.value)*(+xa.value)+(+mb.value)*(+xb.value))/m}
  function torque(){return BAR*(50-pv.value)+(+ma.value)*(xa.value-pv.value)+(+mb.value)*(xb.value-pv.value)}
  function labels(){$("rp").textContent=pv.value+" cm";$("rma").textContent=ma.value+" kg";$("rxa").textContent=xa.value+" cm";$("rmb").textContent=mb.value+" kg";$("rxb").textContent=xb.value+" cm"}
  function draw(){
   var s=Sci.fit(cv,.52),c=s.c,w=s.w,h=s.h,col=getComputedStyle(document.body).color,x0=.08*w,L=.84*w,bt=Math.max(14,w*.04),py=h*.58;
   function X(cm){return x0+L*cm/100}
   c.clearRect(0,0,w,h);c.fillStyle=col;c.strokeStyle=col;c.font=Math.max(12,w*.036)+"px sans-serif";c.lineWidth=2;
   var P=X(+pv.value);
   c.save();c.translate(P,py);c.rotate(ang);c.translate(-P,-py);
   c.save();c.fillStyle="#c9a26b";c.strokeStyle=col;c.beginPath();c.rect(x0,py-bt/2,L,bt);c.fill();c.stroke();c.restore();
   /* 눈금 */
   c.save();c.globalAlpha=.7;c.font=Math.max(10,w*.028)+"px sans-serif";c.textAlign="center";for(var k=0;k<=100;k+=25){c.beginPath();c.moveTo(X(k),py+bt/2);c.lineTo(X(k),py+bt/2+5);c.stroke();c.fillText(k,X(k),py+bt/2+17)}c.restore();
   function weight(m,xx,shape,name,fill){
    if(m<=0)return;var sz=w*.085+m*w*.008,cx=X(xx),top=py-bt/2-sz;
    c.save();c.fillStyle=fill;c.strokeStyle=col;c.lineWidth=2;c.beginPath();
    if(shape==="sq")c.rect(cx-sz/2,top,sz,sz);else c.arc(cx,top+sz/2,sz/2,0,7);
    c.fill();c.stroke();c.fillStyle="#102";c.font="bold "+Math.max(10,sz*.26)+"px sans-serif";c.textAlign="center";c.fillText(name,cx,top+sz/2-1);c.fillText(m+"kg",cx,top+sz/2+Math.max(11,sz*.28));c.restore()}
   weight(+ma.value,+xa.value,"sq","A","#ffa8a8");weight(+mb.value,+xb.value,"ci","B","#a5d8ff");
   if(showCom){var cx=X(com());c.save();c.fillStyle="#e03131";c.strokeStyle=col;c.lineWidth=1.5;c.beginPath();c.moveTo(cx,py-bt/2-2);c.lineTo(cx-8,py-bt/2-17);c.lineTo(cx+8,py-bt/2-17);c.closePath();c.fill();c.stroke();c.restore()}
   c.restore();
   /* 지지점 삼각형(세계 좌표) */
   c.save();c.fillStyle="#666";c.strokeStyle=col;c.beginPath();c.moveTo(P,py+2);c.lineTo(P-w*.04,py+w*.09);c.lineTo(P+w*.04,py+w*.09);c.closePath();c.fill();c.stroke();
   c.textAlign="center";c.fillStyle=col;c.fillText("지지점",P,py+w*.09+16);c.restore();
   if(showCom){c.fillStyle="#e03131";c.fillText("▼ 무게중심 "+com().toFixed(1)+" cm",6,16);c.fillStyle=col}
  }
  function targetAng(){var t=torque(),b=Math.abs(com()-pv.value)<=1;return b?0:Math.max(-1,Math.min(1,t/60))*14*Math.PI/180*(Math.abs(t)<1?0:1)}
  function loop(){var d=tgt-ang;if(Math.abs(d)<.001){ang=tgt;raf=0;draw();return}ang+=d*.18;draw();raf=requestAnimationFrame(loop)}
  function update(){
   labels();tgt=targetAng();
   var cm=com(),bal=Math.abs(cm-pv.value)<=1;
   st.innerHTML='<span>무게중심 <b>'+cm.toFixed(1)+' cm</b></span><span>지지점 <b>'+pv.value+' cm</b></span><span><b>'+(bal?"균형이에요(수평)":(cm>pv.value?"오른쪽이 내려가요":"왼쪽이 내려가요"))+"</b></span>";
   cv.setAttribute("aria-label","막대 길이 100센티미터. 지지점 "+pv.value+"센티미터, 무게중심 "+cm.toFixed(1)+"센티미터. "+(bal?"수평으로 균형":(cm>pv.value?"오른쪽으로 기울어짐":"왼쪽으로 기울어짐")));
   if(reduce){ang=tgt;draw()}else if(!raf)raf=requestAnimationFrame(loop)
  }
  [pv,ma,xa,mb,xb].forEach(function(i){i.addEventListener("input",update)});
  comB.addEventListener("click",function(){showCom=!showCom;comB.setAttribute("aria-pressed",showCom);draw()});
  $("find").addEventListener("click",function(){
   var cm=com();pv.value=Math.round(cm);showCom=true;comB.setAttribute("aria-pressed","true");update();
   msg.textContent="무게중심은 약 "+cm.toFixed(1)+" cm예요. 지지점을 "+Math.round(cm)+" cm에 놓으면 막대가 수평으로 균형이 잡혀요. 추가 무거울수록, 추가 끝에 있을수록 받치는 곳이 추 쪽으로 더 많이 옮겨져요.";
   Exp.reveal()});
  $("rst").addEventListener("click",function(){pv.value=50;ma.value=3;xa.value=85;mb.value=0;xb.value=10;showCom=false;comB.setAttribute("aria-pressed","false");msg.textContent="";update()});
  update();ang=tgt;draw();window.addEventListener("resize",draw);
 }
};
Sci.initExp();
</script></body></html>
