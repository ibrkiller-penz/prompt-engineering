<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>누가 살아남을까 · 온라인 과학 체험</title><meta property="og:type" content="website">
<meta property="og:site_name" content="살빠진 임선생과 함께하는 교육자료">
<meta property="og:title" content="누가 살아남을까 · 온라인 과학 체험">
<meta property="og:description" content="눈에 띄는 벌레는 어떻게 될까?">
<meta property="og:url" content="https://ai-study-science.web.app/exp/E5.html">
<meta property="og:image" content="https://ai-study-science.web.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="../css/common.css">
<style>.stat{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin:8px 0}#cv{cursor:crosshair}#cv:focus-visible{outline:3px solid var(--brand);outline-offset:2px}</style></head>
<body><div class="wrap"><div id="app"></div></div>
<script src="../js/common.js"></script>
<script>
var EXP={
 id:"E5",
 predict:{q:"초록 잎 위에 초록색 벌레와 주황색 벌레가 섞여 있어요. 새(포식자)가 여러 세대 동안 벌레를 잡아먹으면 벌레들의 색은 어떻게 될까요?",options:["주황색 벌레가 더 많아진다","초록색에 가까운 벌레가 더 많아진다","색은 변하지 않는다"],answer:1,
  feedback:["주황색은 잎 위에서 눈에 잘 띄어서 더 많이 잡혀요. 직접 해 보세요.","맞아요! 눈에 덜 띄는 벌레가 더 많이 살아남아 자손을 남겨요.","살아남는 벌레의 색이 달라서 다음 세대의 색 분포가 바뀌어요. 확인해 보세요."]},
 steps:["내가 포식자예요. 벌레를 눌러(터치/클릭) 잡아요. 키보드는 화면을 선택하고 ← ↑ ↓ → 로 조준, Enter로 잡아요. 한 세대에 12마리를 잡아요.","12마리를 잡으면 '다음 세대'를 눌러요. 살아남은 벌레가 자손을 낳아요. 자손의 색은 부모와 비슷하지만 조금씩 달라요.","세대를 4~6번 반복하며 아래 그래프에서 색 분포가 어떻게 바뀌는지 봐요. '배경 바꾸기'로 주황 흙에서도 해 보세요."],
 observe:["세대가 지날수록 벌레들의 평균 색은 어느 쪽으로 움직였나요?","내가 어떤 벌레를 먼저 잡았나요? 왜 그 벌레가 눈에 띄었나요?","배경을 바꾸면 어떤 색 벌레가 늘어났나요?"],
 more:["색종이 조각을 잔디밭이나 낙엽 위에 흩어 놓고, 친구가 30초 동안 찾아 가져가게 해 보세요. 어떤 색이 많이 남을까요?","동물이 몸 색을 배경과 비슷하게 하는 예(보호색)를 찾아 보고, 반대로 눈에 띄는 색이 도움이 되는 경우(경고색)도 찾아 보세요."],
 why:{easy:["벌레마다 색이 조금씩 달라요. 배경과 비슷한 색은 눈에 덜 띄어서 덜 잡혀요.","덜 잡힌 벌레가 더 많이 살아남아서 자손을 더 많이 낳고, 자손도 비슷한 색을 가져요.","그래서 여러 세대가 지나면 그 환경에서 살아남기 쉬운 색의 벌레가 많아져요. 벌레 하나하나가 일부러 색을 바꾸는 것은 아니에요."],
  detail:["자연선택이에요. 조건은 (1) 개체 사이의 변이, (2) 그 변이가 유전됨, (3) 생존·번식에 차이가 생김이에요. 이 세 가지가 있으면 집단의 형질 분포가 세대를 거치며 바뀌어요.","이 화면은 근사 모델이에요. 색을 0(잎과 같은 초록)~1(주황) 사이 연속값으로 두고, 자손은 살아남은 부모 중 한 마리를 무작위로 골라 색 + 작은 무작위 변화(돌연변이·재조합의 대용)를 가졌다고 가정했어요.","실제로는 포식자의 시각, 벌레의 움직임, 그늘, 여러 유전자, 우연(유전적 부동)의 영향이 커요. 소규모 집단에서는 우연만으로도 분포가 달라질 수 있어요. 내가 눌러 잡는 것은 사람이 정한 포식 규칙의 한 예일 뿐이에요."]},
 init:function(el){
  var N=40,KILL=12,gen=1,bg=0,bugs=[],hist=[],eaten=0,cross={x:.5,y:.5},rnd=Math.random;
  el.innerHTML='<canvas id="cv" tabindex="0" role="application" aria-label="잎 위의 벌레들. 방향키로 조준하고 Enter로 잡아요"></canvas>'+
   '<div class="stat" aria-live="polite"><span id="sg"></span><span id="se"></span><span id="sm"></span></div>'+
   '<div class="controls"><button id="nx" class="primary" type="button" disabled>다음 세대</button><button id="auto" type="button">자동 포식자 (눈에 띄는 쪽 잡기)</button><button id="bgb" type="button">배경 바꾸기</button><button id="rst" type="button">처음부터</button></div>'+
   '<canvas id="gr" role="img" aria-label="세대별 벌레 색 분포 그래프"></canvas>'+
   '<p class="note">근사 모델이에요. 왼쪽(초록빛)~오른쪽(주황빛)은 색을 0~1 숫자로 단순화한 것이고, 자손의 색 변화도 임의로 정했어요.</p><p class="note" id="msg" aria-live="polite" style="min-height:1.6em"></p>';
  var cv=el.querySelector("#cv"),gr=el.querySelector("#gr"),nx=el.querySelector("#nx"),msg=el.querySelector("#msg");
  function bgc(){return bg?"hsl(28,62%,46%)":"hsl(110,38%,38%)"}
  function bc(v){return "hsl("+(110-82*v)+","+(45+40*v)+"%,"+(40+15*v)+"%)"}
  function conspic(b){return Math.abs(b.c-bg)}
  function gauss(){return (rnd()+rnd()+rnd()-1.5)*.8}
  function spawn(){bugs=[];for(var i=0;i<N;i++)bugs.push({x:.06+rnd()*.88,y:.08+rnd()*.84,a:rnd()*6.28,c:Math.min(1,Math.max(0,.5+gauss()*.9)),dead:false})}
  function bins(){var b=[0,0,0,0,0];bugs.forEach(function(g){if(!g.dead)b[Math.min(4,Math.floor(g.c*5))]++});return b}
  function mean(){var s=0,n=0;bugs.forEach(function(g){if(!g.dead){s+=g.c;n++}});return n?s/n:0}
  function record(){hist[gen-1]={b:bins(),m:mean()}}
  function reset(){gen=1;eaten=0;hist=[];spawn();record();nx.disabled=true;msg.textContent="";stat();draw()}
  function stat(){el.querySelector("#sg").textContent="세대 "+gen;el.querySelector("#se").textContent="잡은 벌레 "+eaten+" / "+KILL;el.querySelector("#sm").textContent="평균 색 "+mean().toFixed(2)+" (0 초록 ~ 1 주황)"}
  function draw(){
   var s=Sci.fit(cv,.8),g=s.c,w=s.w,h=s.h,col=getComputedStyle(document.body).color;
   g.fillStyle=bgc();g.fillRect(0,0,w,h);
   g.strokeStyle="rgba(0,0,0,.12)";g.lineWidth=2;for(var i=0;i<14;i++){g.beginPath();g.moveTo((i*97%w),0);g.quadraticCurveTo((i*53)%w,h/2,(i*131)%w,h);g.stroke()}
   var r=Math.max(9,w/34);
   bugs.forEach(function(b){if(b.dead)return;var x=b.x*w,y=b.y*h;g.save();g.translate(x,y);g.rotate(b.a);
    g.fillStyle=bc(b.c);g.strokeStyle="rgba(0,0,0,.45)";g.lineWidth=1.2;g.beginPath();g.ellipse(0,0,r,r*.55,0,0,7);g.fill();g.stroke();
    g.beginPath();g.moveTo(r*.8,-r*.2);g.lineTo(r*1.4,-r*.6);g.moveTo(r*.8,r*.2);g.lineTo(r*1.4,r*.6);g.stroke();g.restore()});
   /* 십자선 */
   var cx=cross.x*w,cy=cross.y*h;g.strokeStyle="#fff";g.lineWidth=3;g.shadowColor="#000";g.shadowBlur=3;g.beginPath();g.arc(cx,cy,r*1.3,0,7);g.moveTo(cx-r*1.9,cy);g.lineTo(cx+r*1.9,cy);g.moveTo(cx,cy-r*1.9);g.lineTo(cx,cy+r*1.9);g.stroke();g.shadowBlur=0;
   drawGraph(col)}
  function drawGraph(col){
   var s=Sci.fit(gr,.62),g=s.c,w=s.w,h=s.h,k=Math.max(w/600,.8);
   g.clearRect(0,0,w,h);g.font=(13*Math.max(k,.9))+"px sans-serif";g.fillStyle=col;g.strokeStyle=col;
   var L=40*Math.max(k,.9),T=18,B=44*Math.max(k,.9),Rr=12,pw=w-L-Rr,ph=h-T-B,G=Math.max(hist.length,4),cw=pw/G;
   g.textAlign="left";g.fillText("세대별 색 분포 (점선=평균 색)",4,12);
   hist.forEach(function(e,i){var x=L+i*cw+cw*.12,bw=cw*.76,tot=0,y=T+ph;
    e.b.forEach(function(n,j){var bh=n/N*ph;y-=bh;g.fillStyle=bc((j+.5)/5);g.fillRect(x,y,bw,bh);g.strokeStyle="rgba(0,0,0,.5)";g.lineWidth=1;g.strokeRect(x,y,bw,bh)});
    g.fillStyle=col;g.textAlign="center";g.fillText((i+1)+"세대",x+bw/2,T+ph+16*Math.max(k,.9));g.fillText(e.m.toFixed(2),x+bw/2,T+ph+32*Math.max(k,.9))});
   g.strokeStyle=col;g.lineWidth=2;g.beginPath();g.setLineDash([5,4]);hist.forEach(function(e,i){var px=L+i*cw+cw/2,py=T+ph-e.m*ph;i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();g.setLineDash([]);
   hist.forEach(function(e,i){var px=L+i*cw+cw/2,py=T+ph-e.m*ph;g.fillStyle="#fff";g.beginPath();g.arc(px,py,5,0,7);g.fill();g.stroke()});
   g.strokeStyle=col;g.lineWidth=1.5;g.beginPath();g.moveTo(L,T);g.lineTo(L,T+ph);g.lineTo(L+pw,T+ph);g.stroke();
   g.fillStyle=col;g.textAlign="right";g.fillText("1.0 주황",L-3,T+10);g.fillText("0 초록",L-3,T+ph);
  }
  function eat(b){if(b.dead||eaten>=KILL)return;b.dead=true;eaten++;stat();
   if(eaten>=KILL){nx.disabled=false;msg.textContent="12마리를 잡았어요. '다음 세대'를 눌러 살아남은 벌레의 자손을 보세요.";nx.focus()}
   draw()}
  function nearest(px,py,maxd){var best=null,bd=maxd;bugs.forEach(function(b){if(b.dead)return;var d=Math.hypot(b.x-px,(b.y-py)*.8);if(d<bd){bd=d;best=b}});return best}
  cv.addEventListener("pointerdown",function(e){var r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;cross.x=px;cross.y=py;var b=nearest(px,py,.07);if(b)eat(b);else draw()});
  cv.addEventListener("keydown",function(e){var d=.04,m=true;
   if(e.key==="ArrowLeft")cross.x=Math.max(0,cross.x-d);else if(e.key==="ArrowRight")cross.x=Math.min(1,cross.x+d);else if(e.key==="ArrowUp")cross.y=Math.max(0,cross.y-d);else if(e.key==="ArrowDown")cross.y=Math.min(1,cross.y+d);
   else if(e.key==="Enter"||e.key===" "){var b=nearest(cross.x,cross.y,.12);if(b)eat(b);else msg.textContent="가까운 곳에 벌레가 없어요. 조준을 옮겨 보세요."}else m=false;
   if(m){e.preventDefault();draw()}});
  el.querySelector("#auto").addEventListener("click",function(){
   while(eaten<KILL){var alive=bugs.filter(function(b){return !b.dead});
    /* 눈에 띄는 정도에 비례한 확률로 선택(근사) */
    var wts=alive.map(function(b){return .05+conspic(b)*conspic(b)}),tot=wts.reduce(function(a,b){return a+b},0),r=rnd()*tot,i=0;
    while(i<alive.length-1&&r>wts[i]){r-=wts[i];i++}
    alive[i].dead=true;eaten++}
   stat();nx.disabled=false;msg.textContent="자동 포식자가 눈에 띄는 쪽을 더 자주 잡았어요(근사). '다음 세대'를 눌러요.";draw()});
  nx.addEventListener("click",function(){
   var surv=bugs.filter(function(b){return !b.dead}),nb=[];
   for(var i=0;i<N;i++){var p=surv[Math.floor(rnd()*surv.length)];nb.push({x:.06+rnd()*.88,y:.08+rnd()*.84,a:rnd()*6.28,c:Math.min(1,Math.max(0,p.c+gauss()*.12)),dead:false})}
   bugs=nb;gen++;eaten=0;record();nx.disabled=true;stat();draw();
   msg.textContent=gen+"세대가 태어났어요. 평균 색은 "+hist[gen-1].m.toFixed(2)+"이에요.";
   if(gen>=3)Exp.reveal()});
  el.querySelector("#bgb").addEventListener("click",function(){bg=bg?0:1;msg.textContent="배경이 "+(bg?"주황 흙":"초록 잎")+"으로 바뀌었어요. 이제 "+(bg?"주황":"초록")+"빛 벌레가 눈에 덜 띄어요.";draw()});
  el.querySelector("#rst").addEventListener("click",reset);
  window.addEventListener("resize",draw);reset();
 }
};
Sci.initExp();
</script></body></html>
